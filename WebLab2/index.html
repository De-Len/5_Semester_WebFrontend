<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/edit-window.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/alert.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta charset="UTF-8">
    <title>Tasks</title>
</head>
<body>
<section class="container">
    <div class="upper">
        <div class="upper-left">
            <textarea id="cardTitle" placeholder="Title..."></textarea>
            <textarea id="cardAbout" placeholder="About..."></textarea>
        </div>
        <div class="upper-right">
            <button class="btn" id="openSheet">
                <img src="img/union.svg" alt="plus"/>
            </button>
        </div>
    </div>

    <a id="noTasksArticle">no Tasks</a>

    <div class="overlay" id="overlay"></div>

    <div class="edit-window" id="editWindow">
        <textarea class="mini-input" placeholder="Mini Input..."></textarea>
        <textarea placeholder="Max Input..."></textarea>
        <div class="buttons">
            <button id="cancelBtn">Cancel</button>
            <button id="saveBtn">Save</button>
        </div>
    </div>

    <div class="overlay" id="confirmOverlay"></div>
    <div class="confirm-window" id="confirmWindow">
        <p>Delete this task?</p>
        <div class="confirm-buttons">
            <button id="confirmYes">Yes</button>
            <button id="confirmNo">No</button>
        </div>
    </div>
</section>

<script src="js/main.js"></script>

</body>
</html>
