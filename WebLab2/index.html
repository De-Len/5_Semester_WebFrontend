<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/edit-window.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <section class="container">
        <div class="upper">
            <div class="upper-left">
                <textarea placeholder="Title..."></textarea>
                <textarea placeholder="About..."></textarea>
            </div>
            <div class="upper-right">
                <button class="btn" id="openSheet">
                   <img src="img/union.svg" alt="plus"/>
                </button>
            </div>
        </div>
        <a>no Tasks</a>
        <!-- затемнение -->
        <div class="overlay" id="overlay"></div>

        <!-- всплывающая панель -->
        <div class="edit-window" id="editWindow">
            <textarea class="mini-input" type="text" placeholder="Mini Input..."></textarea>
            <textarea type="text" placeholder="Max Input.."></textarea>
            <div class="buttons">
                <button id="cancelBtn">Cancel</button>
                <button id="saveBtn">Save</button>
            </div>
        </div>
        <div class="task-card">
            <div class="card-content">
                <div>
                    <h3>${miniText}</h3>
                    <p>${maxText}</p>
                </div>
                <button class="delete-btn">&times;</button>
            </div>
        </div>
    </section>
    <script src="js/main.js"></script>

</body>
</html>
